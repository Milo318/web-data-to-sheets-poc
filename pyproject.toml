[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-data-to-sheets-poc"
version = "1.0.0"
description = "A deterministic web-data extraction pipeline with optional AI enrichment."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
web-data-pipeline = "web_data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
